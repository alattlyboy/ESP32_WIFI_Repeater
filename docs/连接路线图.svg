<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="100%"
     font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>ESP32 双芯片中继器 连接路线图（数据流 + 地址分配）</title>

  <rect width="1040" height="660" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#111827">连接路线图 · 一帧数据怎么走到互联网</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">单层 NAT · 单 DHCP · 一个网段 · C5 只做射频前端（esp-hosted 协处理器）</text>
  <text x="1000" y="46" font-size="12" fill="#2563eb" text-anchor="end">固件 2.2.0</text>

  <!-- ===== 客户端 ===== -->
  <rect x="40" y="110" width="150" height="120" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="115" y="140" font-size="14" font-weight="600" fill="#0369a1" text-anchor="middle">手机 / 电脑</text>
  <text x="115" y="162" font-size="11.5" fill="#0c4a6e" text-anchor="middle">192.168.4.2</text>
  <text x="115" y="182" font-size="11" fill="#64748b" text-anchor="middle">DHCP 由 S3 分配</text>
  <text x="115" y="202" font-size="11" fill="#64748b" text-anchor="middle">DNS 随 Offer 下发</text>

  <!-- 无线链路 1 -->
  <path d="M190 170 L250 170" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="220" y="158" font-size="10.5" fill="#0284c7" text-anchor="middle">2.4G</text>
  <text x="220" y="190" font-size="10.5" fill="#94a3b8" text-anchor="middle">802.11n</text>

  <!-- ===== S3 ===== -->
  <rect x="250" y="100" width="250" height="300" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="375" y="128" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">ESP32-S3 · 路由器本体</text>
  <text x="375" y="148" font-size="11" fill="#4f46e5" text-anchor="middle">主机 host · 3.1.0</text>

  <rect x="268" y="162" width="214" height="46" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="280" y="181" font-size="12" font-weight="600" fill="#1e1b4b">SoftAP + DHCP Server</text>
  <text x="280" y="198" font-size="11" fill="#64748b">192.168.4.1 /24 · 信道 6</text>

  <rect x="268" y="216" width="214" height="46" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="280" y="235" font-size="12" font-weight="600" fill="#1e1b4b">NAPT 转发（lwIP）</text>
  <text x="280" y="252" font-size="11" fill="#64748b">客户端 IP → 上行 IP 单层转换</text>

  <rect x="268" y="270" width="214" height="46" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="280" y="289" font-size="12" font-weight="600" fill="#1e1b4b">DNS 下发 + 53 中继</text>
  <text x="280" y="306" font-size="11" fill="#64748b">Offer 带 option 6 · 网关也答 53</text>

  <rect x="268" y="324" width="214" height="46" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="280" y="343" font-size="12" font-weight="600" fill="#1e1b4b">Web UI (httpd :80)</text>
  <text x="280" y="360" font-size="11" fill="#64748b">配置 / 扫描 / 状态 / 诊断</text>

  <!-- SPI -->
  <path d="M500 250 L560 250" stroke="#f59e0b" stroke-width="3"/>
  <path d="M500 266 L560 266" stroke="#f59e0b" stroke-width="1.2"/>
  <path d="M500 282 L560 282" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="530" y="234" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">SPI</text>
  <text x="530" y="300" font-size="10.5" fill="#92400e" text-anchor="middle">40MHz</text>
  <text x="530" y="315" font-size="10.5" fill="#92400e" text-anchor="middle">7 线</text>

  <!-- ===== C5 ===== -->
  <rect x="560" y="150" width="200" height="200" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="660" y="178" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">ESP32-C5 · 射频前端</text>
  <text x="660" y="197" font-size="11" fill="#c2410c" text-anchor="middle">协处理器 CP · 3.1.0</text>
  <text x="660" y="226" font-size="11.5" fill="#7c2d12" text-anchor="middle">STA 关联 + 帧隧道</text>
  <text x="660" y="246" font-size="11.5" fill="#7c2d12" text-anchor="middle">supplicant（PSK / 802.1X）</text>
  <text x="660" y="266" font-size="11.5" fill="#7c2d12" text-anchor="middle">不做 NAT / DHCP / Web</text>
  <text x="660" y="292" font-size="11.5" font-weight="600" fill="#9a3412" text-anchor="middle">10.151.47.228</text>
  <text x="660" y="312" font-size="11" fill="#78716c" text-anchor="middle">上行 5G · 信道 40 · -48dBm</text>
  <text x="660" y="334" font-size="10.5" fill="#a8a29e" text-anchor="middle">单射频：扫描时会短暂离信道</text>

  <!-- 无线链路 2 -->
  <path d="M760 250 L820 250" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="790" y="238" font-size="10.5" fill="#0284c7" text-anchor="middle">5G</text>
  <text x="790" y="268" font-size="10.5" fill="#94a3b8" text-anchor="middle">802.11ax</text>

  <!-- ===== 上级 AP ===== -->
  <rect x="820" y="170" width="180" height="160" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="910" y="198" font-size="13.5" font-weight="600" fill="#166534" text-anchor="middle">校园网 / 家用路由</text>
  <text x="910" y="220" font-size="11" fill="#15803d" text-anchor="middle">SXYYKJXY-Student-5G</text>
  <text x="910" y="242" font-size="11" fill="#64748b" text-anchor="middle">网关 10.151.x.1</text>
  <text x="910" y="262" font-size="11" fill="#64748b" text-anchor="middle">DNS 59.49.49.49</text>
  <text x="910" y="288" font-size="10.5" fill="#16a34a" text-anchor="middle">开放网 / Portal 或 密码</text>
  <text x="910" y="308" font-size="10.5" fill="#16a34a" text-anchor="middle">按源 IP 授权</text>

  <!-- 互联网 -->
  <path d="M1000 250 L1000 250" stroke="#4ade80" stroke-width="2"/>
  <rect x="860" y="380" width="140" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="930" y="410" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Internet</text>
  <text x="930" y="431" font-size="10.5" fill="#64748b" text-anchor="middle">HTTP / HTTPS / DNS</text>
  <path d="M910 330 L910 380" stroke="#4ade80" stroke-width="0.8"/>

  <!-- 控制面 -->
  <rect x="250" y="440" width="510" height="86" rx="12" fill="#fefce8" stroke="#facc15" stroke-width="1.3"/>
  <text x="268" y="464" font-size="12.5" font-weight="700" fill="#854d0e">控制面：S3 → RPC → C5</text>
  <text x="268" y="484" font-size="11.2" fill="#713f12">连接 / 断开 / 扫描 / 企业认证凭据 / 信道 → 全部走 esp-hosted RPC，不占 Web 任务</text>
  <text x="268" y="504" font-size="11.2" fill="#713f12">事件面：C5 把 WIFI_EVENT 上报 → S3 桥接成 WIFI_REMOTE_EVENT → 网卡 up / 拿 IP</text>
  <path d="M375 400 L375 440" stroke="#facc15" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M660 350 L660 440" stroke="#facc15" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 图例 -->
  <rect x="40" y="470" width="190" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="56" y="494" font-size="12" font-weight="700" fill="#374151">图例</text>
  <line x1="56" y1="512" x2="96" y2="512" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="104" y="516" font-size="11" fill="#4b5563">WiFi 空口</text>
  <line x1="56" y1="534" x2="96" y2="534" stroke="#f59e0b" stroke-width="3"/>
  <text x="104" y="538" font-size="11" fill="#4b5563">SPI 数据面</text>
  <line x1="56" y1="556" x2="96" y2="556" stroke="#facc15" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="104" y="560" font-size="11" fill="#4b5563">RPC 控制面</text>
  <text x="56" y="580" font-size="10.5" fill="#9ca3af">只有一层 NAT，没有二次地址转换</text>

  <!-- 底部要点 -->
  <rect x="40" y="606" width="960" height="36" rx="8" fill="#f1f5f9"/>
  <text x="56" y="629" font-size="11.5" fill="#475569">
    验收要点：客户端「有 IP、能解析域名、HTTPS 200、generate_204 返回 204」= 真的能上网；只有「关联成功」不代表通。
  </text>
</svg>
